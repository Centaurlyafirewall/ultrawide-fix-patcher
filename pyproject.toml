[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrawide-fix-patcher"
version = "0.6.3"
description = "Widescreen / ultrawide fix patcher for Windows games — plugin-host architecture with per-engine resolution hooks, FOV/aspect correction, and HUD anchoring."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ultrawide-fix-patcher contributors" }]
keywords = ["ultrawide", "widescreen", "21:9", "32:9", "patcher", "fov", "aspect-ratio", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pefile>=2023.2.7",
    "pymem>=1.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "mypy>=1.9.0"]

[project.scripts]
ultrawide-fix = "ultrawide_fix_patcher.cli.bootstrap:main"

[project.entry-points."ultrawide_fix.plugins"]
unreal_engine = "ultrawide_fix_patcher.plugins.unreal_plugin:UnrealEnginePlugin"
unity_engine  = "ultrawide_fix_patcher.plugins.unity_plugin:UnityEnginePlugin"
source_engine = "ultrawide_fix_patcher.plugins.source_plugin:SourceEnginePlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"